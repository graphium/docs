# Settings for the capture script.

base_url: https://app.dev.graphium.ai

# The script only runs when the header shows this workspace.
workspace_name: Demo Workspace

# The script stops immediately if the header shows any of these.
forbidden_workspaces:
  - Shauna's Workspace
  - Graphium Corp
forbidden_vaults:
  - Engineering Operations Hub

# Browser window used for every capture.
viewport: { width: 1440, height: 900 }
device_scale_factor: 1   # 2 = sharper, larger files

# Wait after each page load and each step (milliseconds).
settle_ms: 1200

# Values you can use in manifest steps as {{name}}.
vars:
  vaultId: 019cd827-3788-7b45-b476-8c83741257d9    # Patient Records (Demo Workspace)
  vaultName: Patient Records
  tableId: 01a0df93-4750-78c3-a3fb-3d1f7e077213    # Providers 40
  qaAssistantId: 019fcd76-72e8-7597-b178-c596b594a21e  # QA Custom Assistant
  playbookId: 019fcd43-e9d8-780a-b4ca-8ee6459cb465    # Patient Demographics Summary Report (draft)
  sheetsConnId: 01a0c4d9-4845-70a4-913f-a50357afbc45  # Google Sheets – Patient Records connection
  emrConnId: 019fcd8a-7d04-7fc0-b2ac-171569c0d484     # QA Test EMR Connection
  searchTerm: ''   # Not needed for now (both search-result screenshots are kept as-is). Set before recapturing them; "Inv" has no results in Patient Records.

# Values that must not change during a run. Each is read before the run and after every
# screenshot whose start_url begins with applies_to; if it changes, the run stops.
watch:
  - label: Providers 40 field count
    url: /vaults/{{vaultId}}/tables/{{tableId}}/schema
    target: { testid: vault-table-count }
    applies_to: /vaults/{{vaultId}}/tables/{{tableId}}
  - label: Patient Records table list (sidebar TABLES section)
    url: /vaults/{{vaultId}}/ai-assistant
    target: { css: '[data-testid="vault-detail-sidebar"] [class*="_group_"]', has_text: TABLES }
    applies_to: /vaults/{{vaultId}}/ai-assistant
  - label: Patient Demographics Summary Report card (trigger, steps)
    url: /vaults/{{vaultId}}/playbooks
    target: { css: '[class*="_card_"]', has_text: Patient Demographics Summary Report }
    applies_to: /vaults/{{vaultId}}/playbooks
  - label: Patient Records connection count
    url: /vaults/{{vaultId}}/connections
    target: { css: '[class*="_count_"]', has_text: connections }
    applies_to: /vaults/{{vaultId}}/connections
